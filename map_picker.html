<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VirtualLocation — 地图选点</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
#map { flex: 1; cursor: crosshair; }
#toolbar {
    padding: 10px 14px;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    min-height: 48px;
}
#toolbar input {
    padding: 6px 10px;
    border: 1px solid #444;
    border-radius: 6px;
    background: #16213e;
    color: #eee;
    font-size: 14px;
    width: 200px;
}
#toolbar button {
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
}
.btn-primary { background: #0f3460; color: #e94560; }
.btn-success { background: #1a8a1a; color: #fff; }
.btn-warn { background: #8a6d00; color: #fff; }
#info-panel {
    padding: 10px 14px;
    background: #0f3460;
    color: #e94560;
    display: flex;
    gap: 20px;
    font-size: 13px;
    font-family: 'Consolas', 'Courier New', monospace;
    flex-wrap: wrap;
    justify-content: space-between;
}
#info-panel span { white-space: nowrap; }
#preset-bar {
    padding: 8px 14px;
    background: #16213e;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    border-top: 1px solid #333;
}
.preset-chip {
    padding: 4px 10px;
    background: #0f3460;
    color: #ccc;
    border-radius: 12px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid transparent;
}
.preset-chip:hover { background: #1a3a6a; border-color: #e94560; }
.preset-chip.active { background: #e94560; color: #fff; border-color: #e94560; }
.marker-pulse {
    animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
    100% { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>

<div id="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 搜索地点 (回车搜索)..." />
    <button class="btn-primary" onclick="search()">搜索</button>
    <button class="btn-success" onclick="copyCoords()">📋 复制坐标</button>
    <button class="btn-warn" onclick="saveAndClose()">💾 保存并返回</button>
    <span style="font-size:12px;color:#888;margin-left:auto;">点击地图选点 | 拖拽标记移动</span>
</div>

<div id="info-panel">
    <span>📍 纬度 (Lat): <b id="latDisplay">31.230400</b></span>
    <span>📍 经度 (Lon): <b id="lonDisplay">121.473700</b></span>
    <span>⛰ 海拔: <b id="altDisplay">10.0m</b></span>
    <span id="gcjInfo" style="color:#888;"></span>
</div>

<div id="preset-bar">
    <span style="color:#888;font-size:12px;line-height:22px;">预设:</span>
</div>

<div id="map"></div>

<script>
// ============================================================
//  Presets
// ============================================================
const presets = [
    { name: '上海·外滩', lat: 31.2304, lon: 121.4737, alt: 10 },
    { name: '北京·天安门', lat: 39.9087, lon: 116.3975, alt: 50 },
    { name: '深圳·腾讯', lat: 22.5408, lon: 113.9345, alt: 15 },
    { name: '广州·广州塔', lat: 23.1065, lon: 113.3245, alt: 20 },
    { name: '成都·太古里', lat: 30.6538, lon: 104.0833, alt: 500 },
    { name: '杭州·西湖', lat: 30.2439, lon: 120.1463, alt: 15 },
    { name: '厦门·鼓浪屿', lat: 24.4479, lon: 118.0685, alt: 5 },
    { name: '三亚·亚龙湾', lat: 18.2236, lon: 109.6352, alt: 5 },
    { name: '香港·中环', lat: 22.2793, lon: 114.1628, alt: 30 },
    { name: '台北·101', lat: 25.0330, lon: 121.5654, alt: 10 },
    { name: '东京·新宿', lat: 35.6895, lon: 139.6917, alt: 35 },
    { name: '纽约·时代广场', lat: 40.7580, lon: -73.9855, alt: 10 },
    { name: '伦敦·大本钟', lat: 51.5007, lon: -0.1246, alt: 15 },
    { name: '巴黎·铁塔', lat: 48.8584, lon: 2.2945, alt: 35 },
    { name: '悉尼·歌剧院', lat: -33.8568, lon: 151.2153, alt: 5 },
];

// ============================================================
//  Map
// ============================================================
const map = L.map('map', {
    center: [31.2304, 121.4737],
    zoom: 15,
    zoomControl: true,
    attributionControl: false,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
}).addTo(map);

// Marker
const markerIcon = L.divIcon({
    className: 'marker-pulse',
    html: '<div style="width:20px;height:20px;background:#e94560;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(233,69,96,0.6);"></div>',
    iconSize: [20, 20],
    iconAnchor: [10, 10],
});

const marker = L.marker([31.2304, 121.4737], {
    draggable: true,
    icon: markerIcon,
}).addTo(map);

// 点击地图移动标记
map.on('click', function(e) {
    marker.setLatLng(e.latlng);
    updateDisplay(e.latlng.lat, e.latlng.lng);
});

// 拖拽标记更新显示
marker.on('drag', function(e) {
    updateDisplay(e.latlng.lat, e.latlng.lng);
});

// 移动地图（按住 Ctrl 时跟随中心）
let followMode = false;
map.on('move', function() {
    if (followMode) {
        const c = map.getCenter();
        marker.setLatLng(c);
        updateDisplay(c.lat, c.lng);
    }
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Control') { followMode = true; map.getContainer().style.cursor = 'move'; }
});
document.addEventListener('keyup', function(e) {
    if (e.key === 'Control') { followMode = false; map.getContainer().style.cursor = 'crosshair'; }
});

// ============================================================
//  WGS-84 → GCJ-02 (火星坐标)
// ============================================================
function wgs84ToGcj02(lat, lon) {
    const a = 6378245.0;
    const ee = 0.00669342162296594323;
    let dLat = transformLat(lon - 105.0, lat - 35.0);
    let dLon = transformLon(lon - 105.0, lat - 35.0);
    const radLat = lat / 180.0 * Math.PI;
    let magic = Math.sin(radLat);
    magic = 1 - ee * magic * magic;
    const sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
    dLon = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
    return [lat + dLat, lon + dLon];
}

function transformLat(x, y) {
    let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
    ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
    ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
    ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320.0 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
    return ret;
}

function transformLon(x, y) {
    let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
    ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
    ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
    ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
    return ret;
}

// ============================================================
//  Display
// ============================================================
let currentLat = 31.2304;
let currentLon = 121.4737;
let currentAlt = 10.0;

function updateDisplay(lat, lon) {
    currentLat = lat;
    currentLon = lon;
    document.getElementById('latDisplay').textContent = lat.toFixed(6);
    document.getElementById('lonDisplay').textContent = lon.toFixed(6);
    document.getElementById('altDisplay').textContent = currentAlt.toFixed(1) + 'm';

    const [gcjLat, gcjLon] = wgs84ToGcj02(lat, lon);
    document.getElementById('gcjInfo').textContent =
        'GCJ-02(高德): ' + gcjLat.toFixed(6) + ', ' + gcjLon.toFixed(6);
}

// ============================================================
//  Search
// ============================================================
async function search() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;

    try {
        const resp = await fetch(
            'https://nominatim.openstreetmap.org/search?format=json&q=' +
            encodeURIComponent(query) + '&limit=5'
        );
        const results = await resp.json();
        if (results.length > 0) {
            const r = results[0];
            const lat = parseFloat(r.lat);
            const lon = parseFloat(r.lon);
            map.setView([lat, lon], 16);
            marker.setLatLng([lat, lon]);
            updateDisplay(lat, lon);
        } else {
            alert('未找到: ' + query);
        }
    } catch (e) {
        alert('搜索失败: ' + e.message);
    }
}

document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') search();
});

// ============================================================
//  Presets
// ============================================================
const presetBar = document.getElementById('preset-bar');
presets.forEach((p, i) => {
    const chip = document.createElement('span');
    chip.className = 'preset-chip';
    chip.textContent = p.name;
    chip.title = p.lat.toFixed(4) + ', ' + p.lon.toFixed(4);
    chip.onclick = function() {
        map.setView([p.lat, p.lon], 16);
        marker.setLatLng([p.lat, p.lon]);
        currentAlt = p.alt;
        updateDisplay(p.lat, p.lon);
        document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
    };
    presetBar.appendChild(chip);
});

// ============================================================
//  Copy / Save
// ============================================================
function copyCoords() {
    const text = currentLat.toFixed(6) + ', ' + currentLon.toFixed(6);
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.btn-success');
        btn.textContent = '✅ 已复制!';
        setTimeout(() => btn.textContent = '📋 复制坐标', 1500);
    }).catch(() => {
        prompt('手动复制:', text);
    });
}

function saveAndClose() {
    const data = {
        lat: currentLat,
        lon: currentLon,
        alt: currentAlt,
    };
    // 写入 localStorage 供 vloc_win.py 读取
    localStorage.setItem('vloc_map_result', JSON.stringify(data));
    alert('坐标已保存！\n纬度: ' + currentLat.toFixed(6) +
          '\n经度: ' + currentLon.toFixed(6) +
          '\n海拔: ' + currentAlt.toFixed(1) + 'm' +
          '\n\n请返回 VirtualLocation 工具点击"从地图导入"');
}
</script>

</body>
</html>
